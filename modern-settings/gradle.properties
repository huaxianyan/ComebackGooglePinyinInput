org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Primary DEX embeds resource IDs that AGP cannot trace; release optimization
# would otherwise delete live English-model and other legacy payloads.
android.enableResourceOptimizations=false
# Android 17 ships its platform as a minor-versioned SDK, so the installed
# directory is platforms/android-37.2 and there is no plain android-37 to fall
# back to. AGP 9.3.1 was only validated up to 37.1, so it warns that the
# compile SDK is untested. Suppressing the warning is a deliberate acceptance:
# the alternative is not compiling against 37 at all. Raising AGP itself is a
# separate change with its own reproducibility impact.
android.suppressUnsupportedCompileSdk=37.2
