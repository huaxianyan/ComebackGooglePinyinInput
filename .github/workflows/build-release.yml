name: Build and release APK

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      operation:
        description: Build APK, build migration APK, or generate lineage
        required: true
        default: build
        type: choice
        options:
          - build
          - build_migration
          - create_lineage
      application_id:
        description: Application ID override for isolated audit builds
        required: false
        type: string
      artifact_name:
        description: Optional Actions artifact label
        required: false
        type: string
      audit_label:
        description: Launcher and IME label for an isolated audit build
        required: false
        default: Settings Audit
        type: string
      debuggable:
        description: Enable Android debug capabilities (isolated audit IDs only)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: google-pinyin-${{ github.ref }}
  cancel-in-progress: false

env:
  APKTOOL_VERSION: "2.12.1"
  APKTOOL_SHA256: "66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa"
  ORIGINAL_APK: original/google-pinyin-input-4.5.2.193126728-arm64-v8a.apk
  ORIGINAL_APK_SHA256: "980fd0f4695f683648e6f7ab9a15a24732e8957b5b14b25d49af931176574bd7"
  FORMAL_APPLICATION_ID: com.google.android.inputmethod.pinyin.compat

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'create_lineage'
    name: Build, sign and verify modern host
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      OPERATION: ${{ inputs.operation || 'build' }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      KEY_ALIAS: ${{ vars.ANDROID_SIGNING_KEY_ALIAS }}
      EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      APPLICATION_ID: ${{ inputs.application_id || vars.ANDROID_APPLICATION_ID }}
      ARTIFACT_LABEL: ${{ inputs.artifact_name || github.sha }}
      AUDIT_LABEL: ${{ inputs.audit_label || 'Settings Audit' }}
      DEBUGGABLE: ${{ inputs.debuggable || 'false' }}
      MODERN_SETTINGS_KS_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      MODERN_SETTINGS_KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and validate release identity
        id: identity
        shell: pwsh
        run: |
          $properties = @{}
          Get-Content version.properties | ForEach-Object {
            $line = $_.Trim()
            if ($line -and -not $line.StartsWith("#")) {
              $name, $value = $line -split "=", 2
              $properties[$name.Trim()] = $value.Trim()
            }
          }
          foreach ($name in @("VERSION_NAME", "VERSION_CODE", "TARGET_SDK", "SIGNING_MODE")) {
            if ([string]::IsNullOrWhiteSpace($properties[$name])) {
              throw "Missing $name in version.properties"
            }
          }
          if ($properties.VERSION_NAME -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid VERSION_NAME: $($properties.VERSION_NAME)"
          }
          $versionCode = 0L
          if (-not [long]::TryParse($properties.VERSION_CODE, [ref]$versionCode) -or $versionCode -le 4520385) {
            throw "VERSION_CODE must be numeric and greater than the v2.0.0 code 4520385"
          }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $expectedTag = "v$($properties.VERSION_NAME)"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag $env:GITHUB_REF_NAME does not match version.properties ($expectedTag)"
            }
            if ($env:APPLICATION_ID -ne $env:FORMAL_APPLICATION_ID) {
              throw "Version tags may only build the formal application ID"
            }
            if ($env:DEBUGGABLE -eq "true") {
              throw "Version tags may not build a debuggable APK"
            }
          }
          if ($env:OPERATION -eq "build_migration" -and
              ($env:APPLICATION_ID -ne $env:FORMAL_APPLICATION_ID -or $env:DEBUGGABLE -eq "true")) {
            throw "Migration acceptance requires the formal application ID and a non-debug build"
          }
          if ($properties.SIGNING_MODE -ne "migration") {
            throw "This release requires the migration signing policy in version.properties"
          }
          # Isolated audit builds retain their existing legacy signer. Formal builds follow the version policy.
          $signingMode = if ($env:APPLICATION_ID -eq $env:FORMAL_APPLICATION_ID) { $properties.SIGNING_MODE } else { "legacy" }
          "SIGNING_MODE=$signingMode" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "signing_mode=$signingMode" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $config = Get-Content signing/signing-materials.json -Raw | ConvertFrom-Json
          $toolsVersion = python -c "import sys; sys.path.insert(0, 'scripts'); from build_modern_settings_host import BUILD_TOOLS_VERSION; print(BUILD_TOOLS_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve pinned Build-Tools version" }
          "BUILD_TOOLS_VERSION=$($toolsVersion.Trim())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          foreach ($item in @(
            @("keystore_secret", $config.newSecrets.keystore),
            @("store_password_secret", $config.newSecrets.storePassword),
            @("key_password_secret", $config.newSecrets.keyPassword)
          )) {
            "$($item[0])=$($item[1])" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          "EXPECTED_VERSION_NAME=$($properties.VERSION_NAME)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPECTED_VERSION_CODE=$($properties.VERSION_CODE)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPECTED_TARGET_SDK=$($properties.TARGET_SDK)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_APK_NAME=ComebackGooglePinyinInput-arm64-v8a-$($properties.VERSION_NAME).apk" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate repository configuration
        shell: pwsh
        run: |
          $required = @{
            ANDROID_SIGNING_KEYSTORE_BASE64 = $env:KEYSTORE_BASE64
            ANDROID_SIGNING_STORE_PASSWORD = $env:STORE_PASSWORD
            ANDROID_SIGNING_KEY_PASSWORD = $env:KEY_PASSWORD
            ANDROID_SIGNING_KEY_ALIAS = $env:KEY_ALIAS
            ANDROID_SIGNING_CERT_SHA256 = $env:EXPECTED_CERT_SHA256
            ANDROID_APPLICATION_ID = $env:APPLICATION_ID
          }
          $missing = @($required.Keys | Where-Object { [string]::IsNullOrWhiteSpace($required[$_]) })
          if ($missing.Count -ne 0) {
            throw "Missing GitHub Actions secrets/variables: $($missing -join ', ')"
          }
          if ($env:DEBUGGABLE -eq "true" -and $env:APPLICATION_ID -eq $env:FORMAL_APPLICATION_ID) {
            throw "Debug mode is forbidden for the formal application ID"
          }
          if ($env:APPLICATION_ID -ne $env:FORMAL_APPLICATION_ID -and [string]::IsNullOrWhiteSpace($env:AUDIT_LABEL)) {
            throw "An isolated audit build requires an unambiguous launcher and IME label"
          }

      - name: Verify deterministic APK payload assembly
        shell: pwsh
        run: |
          python scripts/test_assemble_compose_host_apk.py
          if ($LASTEXITCODE -ne 0) { throw "APK payload assembly is not deterministic" }

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $sdkManager = Join-Path $env:ANDROID_SDK_ROOT "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkManager)) { throw "sdkmanager not found: $sdkManager" }
          # android-36 still backs the reproducible smali generators and the
          # protocol fixtures, which compile against a fixed API surface.
          # android-37.2 is what the Compose host resolves through compileSdk 37
          # plus compileSdkMinor 2, because Android 17 ships a minor-versioned
          # platform directory.
          & $sdkManager "platforms;android-36" "platforms;android-37.2" "build-tools;$env:BUILD_TOOLS_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Unable to install Android SDK platforms and build tools" }

      - name: Download and verify apktool
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/tools | Out-Null
          $url = "https://github.com/iBotPeaches/Apktool/releases/download/v$env:APKTOOL_VERSION/apktool_$env:APKTOOL_VERSION.jar"
          Invoke-WebRequest -Uri $url -OutFile work/tools/apktool.jar
          function Assert-Sha256([string]$Path, [string]$Expected) {
            $actual = (Get-FileHash $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Expected.ToLowerInvariant()) {
              throw "SHA-256 mismatch for $Path. Expected $Expected, got $actual"
            }
          }
          Assert-Sha256 work/tools/apktool.jar $env:APKTOOL_SHA256
          Assert-Sha256 $env:ORIGINAL_APK $env:ORIGINAL_APK_SHA256

      - name: Verify reproducible Rime synchronization Smali
        shell: pwsh
        run: |
          python scripts/generate_rime_sync_smali.py `
            --android-jar "$env:ANDROID_SDK_ROOT\platforms\android-36\android.jar" `
            --jdk "$env:JAVA_HOME" `
            --build-tools "$env:ANDROID_SDK_ROOT\build-tools\36.0.0" `
            --apktool work/tools/apktool.jar
          git diff --exit-code -- patches/smali/rimesync
          if ($LASTEXITCODE -ne 0) { throw "Generated Rime synchronization Smali is stale" }

      - name: Verify reproducible theme-slot Smali
        shell: pwsh
        run: |
          python scripts/generate_system_auto_theme_smali.py `
            --android-jar "$env:ANDROID_SDK_ROOT\platforms\android-36\android.jar" `
            --jdk "$env:JAVA_HOME" `
            --build-tools "$env:ANDROID_SDK_ROOT\build-tools\36.0.0" `
            --apktool work/tools/apktool.jar
          git diff --exit-code -- patches/smali/SystemAutoThemeCompat.smali
          if ($LASTEXITCODE -ne 0) { throw "Generated theme-slot Smali is stale" }

      - name: Verify theme-slot initialization contract
        shell: pwsh
        run: |
          python scripts/verify_theme_slot_initialization.py
          if ($LASTEXITCODE -ne 0) { throw "Theme-slot initialization contract violated" }

      - name: Verify Java and Python StyleSheet recoloring agree
        shell: pwsh
        run: |
          python scripts/test_dynamic_color_rewrite.py `
            --android-jar "$env:ANDROID_SDK_ROOT\platforms\android-36\android.jar" `
            --jdk "$env:JAVA_HOME" `
            --apk "$env:ORIGINAL_APK"

      - name: Restore keystore and verify signing identity
        shell: pwsh
        env:
          ROTATED_KEYSTORE_BASE64: ${{ steps.identity.outputs.signing_mode == 'migration' && secrets[steps.identity.outputs.keystore_secret] || '' }}
          MODERN_SETTINGS_ROTATED_KS_PASS: ${{ steps.identity.outputs.signing_mode == 'migration' && secrets[steps.identity.outputs.store_password_secret] || '' }}
        run: |
          New-Item -ItemType Directory -Force work/signing | Out-Null
          try { $bytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64) }
          catch { throw "ANDROID_SIGNING_KEYSTORE_BASE64 is not valid base64" }
          [IO.File]::WriteAllBytes("work/signing/release.p12", $bytes)
          $keytoolOutput = & keytool -list -v -storetype PKCS12 `
            -keystore work/signing/release.p12 -storepass:env STORE_PASSWORD `
            -alias $env:KEY_ALIAS 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Unable to open signing keystore or alias" }
          $match = [regex]::Match($keytoolOutput, "SHA256:\s*([0-9A-Fa-f:]+)")
          if (-not $match.Success) { throw "Unable to read SHA-256 certificate fingerprint" }
          $actual = $match.Groups[1].Value.Replace(":", "").ToUpperInvariant()
          $expected = $env:EXPECTED_CERT_SHA256.Replace(":", "").ToUpperInvariant()
          if ($actual -ne $expected) {
            throw "Signing certificate mismatch. Expected $expected, got $actual"
          }
          if ($env:SIGNING_MODE -eq "migration") {
            Import-Module ./scripts/signing-material-tools.psm1 -Force
            $config = Get-Content signing/signing-materials.json -Raw | ConvertFrom-Json
            $previous = Get-PemCertificateSha256 (Get-Content (Join-Path signing $config.certificates.previous) -Raw)
            if ($actual -ne $previous) { throw "Legacy signer does not match the pinned previous certificate" }
            if (-not $env:ROTATED_KEYSTORE_BASE64 -or -not $env:MODERN_SETTINGS_ROTATED_KS_PASS) {
              throw "Missing independent rotated signing Secrets"
            }
            [IO.File]::WriteAllBytes("work/signing/rotated.p12", [Convert]::FromBase64String($env:ROTATED_KEYSTORE_BASE64))
            $public = & keytool -exportcert -rfc -storetype PKCS12 -keystore work/signing/rotated.p12 `
              -storepass:env MODERN_SETTINGS_ROTATED_KS_PASS -alias $config.keyAlias | Out-String
            if ($LASTEXITCODE -ne 0) { throw "Unable to open rotated keystore" }
            $rotated = Get-PemCertificateSha256 $public
            $pinned = Get-PemCertificateSha256 (Get-Content (Join-Path signing $config.certificates.current) -Raw)
            if ($rotated -ne $pinned) { throw "Rotated signer does not match the pinned current certificate" }
            "EXPECTED_ROTATED_CERT_SHA256=$rotated" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            "ROTATION_MIN_SDK=$($config.rotationMinSdk)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build signed official Compose Material 3 host
        shell: pwsh
        env:
          MODERN_SETTINGS_ROTATED_KS_PASS: ${{ steps.identity.outputs.signing_mode == 'migration' && secrets[steps.identity.outputs.store_password_secret] || '' }}
          MODERN_SETTINGS_ROTATED_KEY_PASS: ${{ steps.identity.outputs.signing_mode == 'migration' && secrets[steps.identity.outputs.key_password_secret] || '' }}
        run: |
          $arguments = @(
            "scripts/build_modern_settings_host.py",
            "--original", $env:ORIGINAL_APK,
            "--work", "work/release-build",
            "--output", "dist/$env:RELEASE_APK_NAME",
            "--application-id", $env:APPLICATION_ID,
            "--version-name", $env:EXPECTED_VERSION_NAME,
            "--version-code", $env:EXPECTED_VERSION_CODE,
            "--apktool", "work/tools/apktool.jar",
            "--apktool-framework", "work/apktool-framework",
            "--gradle", "modern-settings/gradlew.bat",
            "--sdk", $env:ANDROID_SDK_ROOT,
            "--jdk", $env:JAVA_HOME,
            "--keystore", "work/signing/release.p12",
            "--key-alias", $env:KEY_ALIAS
          )
          if ($env:APPLICATION_ID -ne $env:FORMAL_APPLICATION_ID) {
            $arguments += @("--audit-launcher", "--launcher-label", $env:AUDIT_LABEL, "--ime-label", $env:AUDIT_LABEL)
          }
          if ($env:DEBUGGABLE -eq "true") { $arguments += "--debuggable" }
          if ($env:SIGNING_MODE -eq "migration") {
            $config = Get-Content signing/signing-materials.json -Raw | ConvertFrom-Json
            $arguments += @("--rotation-lineage", (Join-Path signing $config.lineage),
              "--rotation-keystore", "work/signing/rotated.p12", "--rotation-key-alias", $config.keyAlias)
          }
          # Public arguments only: passwords stay in the signing tool's environment.
          ConvertTo-Json -InputObject $arguments | Set-Content work/release-build-arguments.json -Encoding utf8
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw "Modern host build failed" }

      - name: Run Compose state and contract tests
        shell: pwsh
        run: |
          $env:GRADLE_USER_HOME = "$env:GITHUB_WORKSPACE\work\modern-settings-gradle-home"
          ./modern-settings/gradlew.bat -p modern-settings :compose-runtime:testDebugUnitTest

      - name: Verify Chinese copywriting
        shell: pwsh
        run: python scripts/verify_chinese_copywriting.py

      - name: Verify versioned release notes
        shell: pwsh
        run: |
          python scripts/test_verify_release_notes.py
          if ($LASTEXITCODE -ne 0) { throw "Release notes regression tests failed" }
          python scripts/verify_release_notes.py
          if ($LASTEXITCODE -ne 0) { throw "Release notes format failed" }

      - name: Decode and verify final APK
        shell: pwsh
        run: |
          java -jar work/tools/apktool.jar d -f -p work/final-framework `
            -o work/final-decoded "dist/$env:RELEASE_APK_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Final APK decode failed" }

          # A pwsh step reports only the exit code of its last command, so a bare
          # list of gate invocations would let every earlier failure pass
          # silently. Keep the gates in one array and guard each iteration, so a
          # gate cannot be added without also being enforced.
          $androidJar = "$env:ANDROID_SDK_ROOT\platforms\android-36\android.jar"
          $apk = "dist/$env:RELEASE_APK_NAME"
          $gates = @(
            @("scripts/verify_modern_settings_runtime.py",
              "--project", "modern-settings", "--decoded", "work/final-decoded",
              "--apk", $apk),
            @("scripts/verify_md3.py", "work/final-decoded"),
            @("scripts/verify_target31.py", "work/final-decoded"),
            @("scripts/verify_target33.py", "work/final-decoded"),
            @("scripts/verify_target34.py", "work/final-decoded"),
            @("scripts/verify_target35.py", "work/final-decoded"),
            @("scripts/verify_target36.py", "work/final-decoded"),
            @("scripts/verify_target37.py", "work/final-decoded"),
            @("scripts/verify_universal_keyboard_header.py", "work/final-decoded"),
            @("scripts/verify_simplified_traditional_header_toggle.py", "work/final-decoded"),
            @("scripts/verify_english_t9_multitap.py", "work/final-decoded"),
            @("scripts/verify_paired_punctuation.py", "work/final-decoded"),
            @("scripts/verify_rime_legacy_settings.py", "work/final-decoded"),
            @("scripts/verify_candidate_frame_rate.py", "work/final-decoded"),
            @("scripts/verify_header_motion.py", "work/final-decoded"),
            @("scripts/verify_handwriting_animation.py", "work/final-decoded"),
            @("scripts/verify_symbol_pager_frame_rate.py", "work/final-decoded"),
            @("scripts/verify_symbol_pager_settle.py", "work/final-decoded"),
            @("scripts/verify_scroll_touch_compat.py", "work/final-decoded"),
            @("scripts/verify_keyboard_switch_animation.py", "work/final-decoded"),
            @("scripts/verify_inline_autofill.py", "work/final-decoded",
              "--android-jar", $androidJar, "--jdk", $env:JAVA_HOME),
            @("scripts/test_header_platform.py",
              "--android-jar", $androidJar, "--jdk", $env:JAVA_HOME,
              "--decoded", "work/final-decoded"),
            @("scripts/test_sensitive_clipboard_compat.py",
              "--android-jar", $androidJar, "--jdk", $env:JAVA_HOME,
              "--decoded", "work/final-decoded"),
            @("scripts/test_rime_sync_protocol.py",
              "--sdk", $env:ANDROID_SDK_ROOT, "--jdk", $env:JAVA_HOME,
              "--decoded", "work/final-decoded")
          )
          foreach ($gate in $gates) {
            python @gate
            if ($LASTEXITCODE -ne 0) { throw "Final APK gate failed: $($gate -join ' ')" }
          }

          $aapt2 = Join-Path $env:ANDROID_SDK_ROOT "build-tools/$env:BUILD_TOOLS_VERSION/aapt2.exe"
          & $aapt2 dump resources $apk | Out-File work/final-resources.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "aapt2 resource dump failed" }
          python scripts/verify_stable_resource_ids.py `
            work/release-build/decoded/res/values/public.xml `
            work/final-resources.txt
          if ($LASTEXITCODE -ne 0) { throw "Stable resource ID verification failed" }

      - name: Verify package, version and SDK-specific signing identity
        shell: pwsh
        run: |
          $metadata = Get-Content work/final-decoded/apktool.yml -Raw
          $manifest = Get-Content work/final-decoded/AndroidManifest.xml -Raw
          foreach ($item in @(
            @("versionCode", $env:EXPECTED_VERSION_CODE),
            @("versionName", $env:EXPECTED_VERSION_NAME),
            @("targetSdkVersion", $env:EXPECTED_TARGET_SDK)
          )) {
            if ($metadata -notmatch ("(?m)^\s*" + $item[0] + ":\s*" + [regex]::Escape($item[1]) + "\s*$")) {
              throw "$($item[0]) mismatch; expected $($item[1])"
            }
          }
          if ($manifest -notmatch ('package="' + [regex]::Escape($env:APPLICATION_ID) + '"')) {
            throw "Application ID mismatch; expected $env:APPLICATION_ID"
          }
          $hasDebuggable = $manifest -match 'android:debuggable="true"'
          if ($hasDebuggable -ne ($env:DEBUGGABLE -eq "true")) { throw "Debuggable mismatch" }
          $identity = @("scripts/verify_apk_signing_identity.py", "dist/$env:RELEASE_APK_NAME",
            "--sdk", $env:ANDROID_SDK_ROOT, "--jdk", $env:JAVA_HOME,
            "--target-sdk", $env:EXPECTED_TARGET_SDK, "--expected-legacy-sha256", $env:EXPECTED_CERT_SHA256)
          if ($env:SIGNING_MODE -eq "migration") {
            $identity += @("--expected-rotated-sha256", $env:EXPECTED_ROTATED_CERT_SHA256)
          }
          python @identity
          if ($LASTEXITCODE -ne 0) { throw "SDK-specific signing identity verification failed" }

      - name: Verify deterministic APK signing
        shell: pwsh
        env:
          MODERN_SETTINGS_ROTATED_KS_PASS: ${{ steps.identity.outputs.signing_mode == 'migration' && secrets[steps.identity.outputs.store_password_secret] || '' }}
          MODERN_SETTINGS_ROTATED_KEY_PASS: ${{ steps.identity.outputs.signing_mode == 'migration' && secrets[steps.identity.outputs.key_password_secret] || '' }}
        run: |
          $arguments = @(Get-Content work/release-build-arguments.json -Raw | ConvertFrom-Json)
          $index = [Array]::IndexOf($arguments, "--output")
          $arguments[$index + 1] = "work/repro.apk"
          $arguments += "--resign-only"
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw "Deterministic signing check failed" }
          if ((Get-FileHash "dist/$env:RELEASE_APK_NAME" -Algorithm SHA256).Hash -ne `
              (Get-FileHash work/repro.apk -Algorithm SHA256).Hash) {
            throw "Signed builds are not byte-identical"
          }

      - name: Verify native 16 KiB ELF and RELRO layout
        shell: pwsh
        run: |
          python scripts/audit_elf_page_size.py "dist/$env:RELEASE_APK_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Native 16 KiB audit failed" }

      - name: Prepare release artifact
        id: artifact
        shell: pwsh
        run: |
          $releasePath = "dist/$env:RELEASE_APK_NAME"
          $sha256 = (Get-FileHash $releasePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "path=$releasePath" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$sha256" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "SHA-256  $sha256  $env:RELEASE_APK_NAME" | Out-File "$releasePath.sha256" -Encoding ascii
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @"
          ## Signed official Compose Material 3 APK

          - File: ``$env:RELEASE_APK_NAME``
          - SHA-256: ``$sha256``
          - Version: ``$env:EXPECTED_VERSION_NAME`` (``$env:EXPECTED_VERSION_CODE``)
          - Application ID: ``$env:APPLICATION_ID``
          - target SDK: ``$env:EXPECTED_TARGET_SDK``
          - Debuggable: ``$env:DEBUGGABLE``
          - Signing operation: ``$env:OPERATION``
          - Legacy signing certificate: ``$env:EXPECTED_CERT_SHA256``
          "@
          if ($env:SIGNING_MODE -eq "migration") {
            Add-Content $env:GITHUB_STEP_SUMMARY "- Rotated signing certificate: $env:EXPECTED_ROTATED_CERT_SHA256"
            Add-Content $env:GITHUB_STEP_SUMMARY "- Rotation begins at SDK: $env:ROTATION_MIN_SDK"
          }

      - name: Prepare versioned release body
        shell: pwsh
        env:
          APK_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          $signingRows = "| 签名证书 SHA-256 | ``$env:EXPECTED_CERT_SHA256`` |"
          if ($env:SIGNING_MODE -eq "migration") {
            $lastLegacySdk = [int]$env:ROTATION_MIN_SDK - 1
            $signingRows = "| 签名证书（SDK 23～$lastLegacySdk） | ``$env:EXPECTED_CERT_SHA256`` |`n" +
              "| 签名证书（SDK $env:ROTATION_MIN_SDK 起） | ``$env:EXPECTED_ROTATED_CERT_SHA256`` |"
          }
          $notes = @"
          ## 构建信息

          | 项目 | 值 |
          | --- | --- |
          | 版本 | ``v$env:EXPECTED_VERSION_NAME`` |
          | versionCode | ``$env:EXPECTED_VERSION_CODE`` |
          | 架构 | ``arm64-v8a`` |
          | min / target SDK | ``23 / $env:EXPECTED_TARGET_SDK`` |
          | 包名 | ``$env:APPLICATION_ID`` |
          | APK SHA-256 | ``$env:APK_SHA256`` |
          $signingRows
          | 源码提交 | ``$env:GITHUB_SHA`` |
          "@
          $releaseNotesSource = "docs/releases/v$env:EXPECTED_VERSION_NAME.md"
          if (-not (Test-Path $releaseNotesSource)) { throw "Missing versioned release notes: $releaseNotesSource" }
          Get-Content $releaseNotesSource -Raw | Out-File dist/release-notes.md -Encoding utf8
          Add-Content dist/release-notes.md "`n$notes"
          python scripts/verify_release_notes.py dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Assembled release body format failed" }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComebackGooglePinyinInput-${{ env.ARTIFACT_LABEL }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for matching version tag
        if: startsWith(github.ref, 'refs/tags/v') && inputs.operation != 'build_migration'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          APK_PATH: ${{ steps.artifact.outputs.path }}
          APK_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:TAG_NAME already exists; published releases and assets are immutable"
          } else {
            gh release create $env:TAG_NAME `
              "$env:APK_PATH" `
              "$env:APK_PATH.sha256" `
              --repo $env:GITHUB_REPOSITORY --verify-tag `
              --title "$env:TAG_NAME" `
              --notes-file dist/release-notes.md
          }

      - name: Remove restored keystores
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @("work/signing/release.p12", "work/signing/rotated.p12")) {
            if (Test-Path $path) { Remove-Item -LiteralPath $path -Force -ErrorAction Stop }
          }

  create-lineage:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'create_lineage'
    name: Generate public signing lineage only
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve signing configuration
        id: signing
        shell: pwsh
        run: |
          $config = Get-Content signing/signing-materials.json -Raw | ConvertFrom-Json
          $version = python -c "import sys; sys.path.insert(0, 'scripts'); from build_modern_settings_host import BUILD_TOOLS_VERSION; print(BUILD_TOOLS_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve pinned Build-Tools version" }
          $outputs = @{
            base_name = $config.fileBaseName
            keystore_secret = $config.newSecrets.keystore
            store_password_secret = $config.newSecrets.storePassword
            key_password_secret = $config.newSecrets.keyPassword
            build_tools_version = $version.Trim()
          }
          foreach ($name in $outputs.Keys) {
            "$name=$($outputs[$name])" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Prepare pinned signing tool
        shell: pwsh
        run: |
          $version = "${{ steps.signing.outputs.build_tools_version }}"
          $jar = Join-Path $env:ANDROID_SDK_ROOT "build-tools/$version/lib/apksigner.jar"
          if (-not (Test-Path $jar)) {
            $sdkManager = Join-Path $env:ANDROID_SDK_ROOT "cmdline-tools/latest/bin/sdkmanager.bat"
            & $sdkManager "build-tools;$version"
            if ($LASTEXITCODE -ne 0) { throw "Unable to install pinned signing tool" }
          }

      - name: Generate and validate lineage using existing and new Secrets
        shell: pwsh
        env:
          CI_OLD_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          CI_OLD_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          CI_OLD_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          CI_OLD_ALIAS: ${{ vars.ANDROID_SIGNING_KEY_ALIAS }}
          CI_NEW_KEYSTORE: ${{ secrets[steps.signing.outputs.keystore_secret] }}
          CI_NEW_STORE_PASSWORD: ${{ secrets[steps.signing.outputs.store_password_secret] }}
          CI_NEW_KEY_PASSWORD: ${{ secrets[steps.signing.outputs.key_password_secret] }}
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content signing/signing-materials.json -Raw | ConvertFrom-Json
          $required = @{
            ANDROID_SIGNING_KEYSTORE_BASE64 = $env:CI_OLD_KEYSTORE
            ANDROID_SIGNING_STORE_PASSWORD = $env:CI_OLD_STORE_PASSWORD
            ANDROID_SIGNING_KEY_PASSWORD = $env:CI_OLD_KEY_PASSWORD
            ($config.newSecrets.keystore) = $env:CI_NEW_KEYSTORE
            ($config.newSecrets.storePassword) = $env:CI_NEW_STORE_PASSWORD
            ($config.newSecrets.keyPassword) = $env:CI_NEW_KEY_PASSWORD
          }
          $missing = @($required.Keys | Where-Object { [string]::IsNullOrWhiteSpace($required[$_]) })
          if ($missing.Count) { throw "Missing signing Secrets: $($missing -join ', ')" }
          $directory = Join-Path $env:GITHUB_WORKSPACE "work/lineage-signing"
          $backup = Join-Path $directory "Backup"
          $artifacts = Join-Path $env:GITHUB_WORKSPACE "work/lineage-artifacts"
          $baseName = $config.fileBaseName
          try {
            New-Item -ItemType Directory -Force $backup, $artifacts | Out-Null
            [IO.File]::WriteAllBytes((Join-Path $backup "$baseName.p12"), [Convert]::FromBase64String($env:CI_OLD_KEYSTORE))
            [IO.File]::WriteAllBytes((Join-Path $directory "$baseName.p12"), [Convert]::FromBase64String($env:CI_NEW_KEYSTORE))
            Copy-Item (Join-Path "signing" $config.certificates.previous) (Join-Path $backup "$baseName-certificate.pem")
            Copy-Item (Join-Path "signing" $config.certificates.current) (Join-Path $directory "$baseName-certificate.pem")
            $jar = Join-Path $env:ANDROID_SDK_ROOT "build-tools/${{ steps.signing.outputs.build_tools_version }}/lib/apksigner.jar"
            ./scripts/create-signing-lineage.ps1 -SigningDirectory $directory `
              -OldKeyAlias $env:CI_OLD_ALIAS -JdkDirectory $env:JAVA_HOME -ApksignerJar $jar `
              -OldStorePasswordEnv CI_OLD_STORE_PASSWORD -OldKeyPasswordEnv CI_OLD_KEY_PASSWORD `
              -NewStorePasswordEnv CI_NEW_STORE_PASSWORD -NewKeyPasswordEnv CI_NEW_KEY_PASSWORD
            Copy-Item (Join-Path $directory "$baseName-lineage.bin") $artifacts
            Copy-Item (Join-Path $directory "SIGNING-LINEAGE-INFO.txt") $artifacts
          } finally {
            if (Test-Path $directory) { Remove-Item -LiteralPath $directory -Recurse -Force }
          }

      - name: Upload public lineage and verification report
        uses: actions/upload-artifact@v4
        with:
          name: signing-lineage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/lineage-artifacts/${{ steps.signing.outputs.base_name }}-lineage.bin
            work/lineage-artifacts/SIGNING-LINEAGE-INFO.txt
          if-no-files-found: error
          retention-days: 7
