name: Build and release APK

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      application_id:
        description: Application ID override for isolated audit builds
        required: false
        type: string
      artifact_name:
        description: Optional Actions artifact label
        required: false
        type: string
      audit_label:
        description: Launcher and IME label for an isolated audit build
        required: false
        default: Settings Audit
        type: string
      debuggable:
        description: Enable Android debug capabilities (isolated audit IDs only)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: google-pinyin-${{ github.ref }}
  cancel-in-progress: false

env:
  APKTOOL_VERSION: "2.12.1"
  APKTOOL_SHA256: "66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa"
  ORIGINAL_APK: original/google-pinyin-input-4.5.2.193126728-arm64-v8a.apk
  ORIGINAL_APK_SHA256: "980fd0f4695f683648e6f7ab9a15a24732e8957b5b14b25d49af931176574bd7"
  FORMAL_APPLICATION_ID: com.google.android.inputmethod.pinyin.compat

jobs:
  build:
    name: Build, sign and verify modern host
    runs-on: windows-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      KEY_ALIAS: ${{ vars.ANDROID_SIGNING_KEY_ALIAS }}
      EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      APPLICATION_ID: ${{ inputs.application_id || vars.ANDROID_APPLICATION_ID }}
      ARTIFACT_LABEL: ${{ inputs.artifact_name || github.sha }}
      AUDIT_LABEL: ${{ inputs.audit_label || 'Settings Audit' }}
      DEBUGGABLE: ${{ inputs.debuggable || 'false' }}
      MODERN_SETTINGS_KS_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      MODERN_SETTINGS_KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and validate release identity
        shell: pwsh
        run: |
          $properties = @{}
          Get-Content version.properties | ForEach-Object {
            $line = $_.Trim()
            if ($line -and -not $line.StartsWith("#")) {
              $name, $value = $line -split "=", 2
              $properties[$name.Trim()] = $value.Trim()
            }
          }
          foreach ($name in @("VERSION_NAME", "VERSION_CODE", "TARGET_SDK", "RELEASE_TITLE")) {
            if ([string]::IsNullOrWhiteSpace($properties[$name])) {
              throw "Missing $name in version.properties"
            }
          }
          if ($properties.VERSION_NAME -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid VERSION_NAME: $($properties.VERSION_NAME)"
          }
          $versionCode = 0L
          if (-not [long]::TryParse($properties.VERSION_CODE, [ref]$versionCode) -or $versionCode -le 4520385) {
            throw "VERSION_CODE must be numeric and greater than the v2.0.0 code 4520385"
          }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $expectedTag = "v$($properties.VERSION_NAME)"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag $env:GITHUB_REF_NAME does not match version.properties ($expectedTag)"
            }
            if ($env:APPLICATION_ID -ne $env:FORMAL_APPLICATION_ID) {
              throw "Version tags may only build the formal application ID"
            }
            if ($env:DEBUGGABLE -eq "true") {
              throw "Version tags may not build a debuggable APK"
            }
          }
          "EXPECTED_VERSION_NAME=$($properties.VERSION_NAME)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPECTED_VERSION_CODE=$($properties.VERSION_CODE)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPECTED_TARGET_SDK=$($properties.TARGET_SDK)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPECTED_RELEASE_TITLE=$($properties.RELEASE_TITLE)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_APK_NAME=ComebackGooglePinyinInput-arm64-v8a-$($properties.VERSION_NAME).apk" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate repository configuration
        shell: pwsh
        run: |
          $required = @{
            ANDROID_SIGNING_KEYSTORE_BASE64 = $env:KEYSTORE_BASE64
            ANDROID_SIGNING_STORE_PASSWORD = $env:STORE_PASSWORD
            ANDROID_SIGNING_KEY_PASSWORD = $env:KEY_PASSWORD
            ANDROID_SIGNING_KEY_ALIAS = $env:KEY_ALIAS
            ANDROID_SIGNING_CERT_SHA256 = $env:EXPECTED_CERT_SHA256
            ANDROID_APPLICATION_ID = $env:APPLICATION_ID
          }
          $missing = @($required.Keys | Where-Object { [string]::IsNullOrWhiteSpace($required[$_]) })
          if ($missing.Count -ne 0) {
            throw "Missing GitHub Actions secrets/variables: $($missing -join ', ')"
          }
          if ($env:DEBUGGABLE -eq "true" -and $env:APPLICATION_ID -eq $env:FORMAL_APPLICATION_ID) {
            throw "Debug mode is forbidden for the formal application ID"
          }
          if ($env:APPLICATION_ID -ne $env:FORMAL_APPLICATION_ID -and [string]::IsNullOrWhiteSpace($env:AUDIT_LABEL)) {
            throw "An isolated audit build requires an unambiguous launcher and IME label"
          }

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $sdkManager = Join-Path $env:ANDROID_SDK_ROOT "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkManager)) { throw "sdkmanager not found: $sdkManager" }
          & $sdkManager "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Unable to install Android SDK 36 build tools" }

      - name: Download and verify apktool
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/tools | Out-Null
          $url = "https://github.com/iBotPeaches/Apktool/releases/download/v$env:APKTOOL_VERSION/apktool_$env:APKTOOL_VERSION.jar"
          Invoke-WebRequest -Uri $url -OutFile work/tools/apktool.jar
          function Assert-Sha256([string]$Path, [string]$Expected) {
            $actual = (Get-FileHash $Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Expected.ToLowerInvariant()) {
              throw "SHA-256 mismatch for $Path. Expected $Expected, got $actual"
            }
          }
          Assert-Sha256 work/tools/apktool.jar $env:APKTOOL_SHA256
          Assert-Sha256 $env:ORIGINAL_APK $env:ORIGINAL_APK_SHA256

      - name: Restore keystore and verify signing identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/signing | Out-Null
          try { $bytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64) }
          catch { throw "ANDROID_SIGNING_KEYSTORE_BASE64 is not valid base64" }
          [IO.File]::WriteAllBytes("work/signing/release.p12", $bytes)
          $keytoolOutput = & keytool -list -v -storetype PKCS12 `
            -keystore work/signing/release.p12 -storepass $env:STORE_PASSWORD `
            -alias $env:KEY_ALIAS 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Unable to open signing keystore or alias" }
          $match = [regex]::Match($keytoolOutput, "SHA256:\s*([0-9A-Fa-f:]+)")
          if (-not $match.Success) { throw "Unable to read SHA-256 certificate fingerprint" }
          $actual = $match.Groups[1].Value.Replace(":", "").ToUpperInvariant()
          $expected = $env:EXPECTED_CERT_SHA256.Replace(":", "").ToUpperInvariant()
          if ($actual -ne $expected) {
            throw "Signing certificate mismatch. Expected $expected, got $actual"
          }

      - name: Build signed official Compose Material 3 host
        shell: pwsh
        run: |
          $arguments = @(
            "scripts/build_modern_settings_host.py",
            "--original", $env:ORIGINAL_APK,
            "--work", "work/release-build",
            "--output", "dist/$env:RELEASE_APK_NAME",
            "--application-id", $env:APPLICATION_ID,
            "--version-name", $env:EXPECTED_VERSION_NAME,
            "--version-code", $env:EXPECTED_VERSION_CODE,
            "--apktool", "work/tools/apktool.jar",
            "--apktool-framework", "work/apktool-framework",
            "--gradle", "modern-settings/gradlew.bat",
            "--sdk", $env:ANDROID_SDK_ROOT,
            "--jdk", $env:JAVA_HOME,
            "--keystore", "work/signing/release.p12",
            "--key-alias", $env:KEY_ALIAS
          )
          if ($env:APPLICATION_ID -ne $env:FORMAL_APPLICATION_ID) {
            $arguments += @("--audit-launcher", "--launcher-label", $env:AUDIT_LABEL, "--ime-label", $env:AUDIT_LABEL)
          }
          if ($env:DEBUGGABLE -eq "true") { $arguments += "--debuggable" }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw "Modern host build failed" }

      - name: Run Compose state and contract tests
        shell: pwsh
        run: |
          $env:GRADLE_USER_HOME = "$env:GITHUB_WORKSPACE\work\modern-settings-gradle-home"
          ./modern-settings/gradlew.bat -p modern-settings :compose-runtime:testDebugUnitTest

      - name: Verify Chinese copywriting
        shell: pwsh
        run: python scripts/verify_chinese_copywriting.py

      - name: Decode and verify final APK
        shell: pwsh
        run: |
          java -jar work/tools/apktool.jar d -f -p work/final-framework `
            -o work/final-decoded "dist/$env:RELEASE_APK_NAME"
          python scripts/verify_modern_settings_runtime.py `
            --project modern-settings --decoded work/final-decoded `
            --apk "dist/$env:RELEASE_APK_NAME"
          python scripts/verify_md3.py work/final-decoded
          python scripts/verify_target31.py work/final-decoded
          python scripts/verify_target33.py work/final-decoded
          python scripts/verify_target34.py work/final-decoded
          python scripts/verify_target35.py work/final-decoded
          python scripts/verify_target36.py work/final-decoded
          python scripts/verify_universal_keyboard_header.py work/final-decoded
          python scripts/verify_simplified_traditional_header_toggle.py work/final-decoded
          python scripts/verify_candidate_frame_rate.py work/final-decoded
          python scripts/verify_symbol_pager_frame_rate.py work/final-decoded
          python scripts/verify_inline_autofill.py work/final-decoded `
            --android-jar "$env:ANDROID_SDK_ROOT\platforms\android-36\android.jar" `
            --jdk "$env:JAVA_HOME"
          python scripts/test_header_platform.py `
            --android-jar "$env:ANDROID_SDK_ROOT\platforms\android-36\android.jar" `
            --jdk "$env:JAVA_HOME" --decoded work/final-decoded
          python scripts/test_sensitive_clipboard_compat.py `
            --android-jar "$env:ANDROID_SDK_ROOT\platforms\android-36\android.jar" `
            --jdk "$env:JAVA_HOME" --decoded work/final-decoded
          $aapt2 = Join-Path $env:ANDROID_SDK_ROOT "build-tools\36.0.0\aapt2.exe"
          & $aapt2 dump resources "dist/$env:RELEASE_APK_NAME" | `
            Out-File work/final-resources.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "aapt2 resource dump failed" }
          python scripts/verify_stable_resource_ids.py `
            work/release-build/decoded/res/values/public.xml `
            work/final-resources.txt

      - name: Verify package, version, signing and alignment
        shell: pwsh
        run: |
          $metadata = Get-Content work/final-decoded/apktool.yml -Raw
          $manifest = Get-Content work/final-decoded/AndroidManifest.xml -Raw
          foreach ($item in @(
            @("versionCode", $env:EXPECTED_VERSION_CODE),
            @("versionName", $env:EXPECTED_VERSION_NAME),
            @("targetSdkVersion", $env:EXPECTED_TARGET_SDK)
          )) {
            if ($metadata -notmatch ("(?m)^\s*" + $item[0] + ":\s*" + [regex]::Escape($item[1]) + "\s*$")) {
              throw "$($item[0]) mismatch; expected $($item[1])"
            }
          }
          if ($manifest -notmatch ('package="' + [regex]::Escape($env:APPLICATION_ID) + '"')) {
            throw "Application ID mismatch; expected $env:APPLICATION_ID"
          }
          $hasDebuggable = $manifest -match 'android:debuggable="true"'
          if ($hasDebuggable -ne ($env:DEBUGGABLE -eq "true")) { throw "Debuggable mismatch" }
          $apksigner = Join-Path $env:ANDROID_SDK_ROOT "build-tools\36.0.0\apksigner.bat"
          $zipalign = Join-Path $env:ANDROID_SDK_ROOT "build-tools\36.0.0\zipalign.exe"
          & $apksigner verify --verbose --print-certs "dist/$env:RELEASE_APK_NAME"
          if ($LASTEXITCODE -ne 0) { throw "APK signature verification failed" }
          & $zipalign -c -P 16 4 "dist/$env:RELEASE_APK_NAME"
          if ($LASTEXITCODE -ne 0) { throw "16 KiB ZIP alignment verification failed" }

      - name: Verify reproducible signed build
        shell: pwsh
        run: |
          $arguments = @(
            "scripts/build_modern_settings_host.py",
            "--original", $env:ORIGINAL_APK,
            "--work", "work/repro-build",
            "--output", "work/repro.apk",
            "--application-id", $env:APPLICATION_ID,
            "--version-name", $env:EXPECTED_VERSION_NAME,
            "--version-code", $env:EXPECTED_VERSION_CODE,
            "--apktool", "work/tools/apktool.jar",
            "--apktool-framework", "work/repro-framework",
            "--gradle", "modern-settings/gradlew.bat",
            "--sdk", $env:ANDROID_SDK_ROOT,
            "--jdk", $env:JAVA_HOME,
            "--keystore", "work/signing/release.p12",
            "--key-alias", $env:KEY_ALIAS
          )
          if ($env:APPLICATION_ID -ne $env:FORMAL_APPLICATION_ID) {
            $arguments += @("--audit-launcher", "--launcher-label", $env:AUDIT_LABEL, "--ime-label", $env:AUDIT_LABEL)
          }
          if ($env:DEBUGGABLE -eq "true") { $arguments += "--debuggable" }
          python @arguments
          if ((Get-FileHash "dist/$env:RELEASE_APK_NAME" -Algorithm SHA256).Hash -ne `
              (Get-FileHash work/repro.apk -Algorithm SHA256).Hash) {
            throw "Signed builds are not byte-identical"
          }

      - name: Prepare release artifact
        id: artifact
        shell: pwsh
        run: |
          $releasePath = "dist/$env:RELEASE_APK_NAME"
          $sha256 = (Get-FileHash $releasePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "path=$releasePath" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$sha256" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "SHA-256  $sha256  $env:RELEASE_APK_NAME" | Out-File "$releasePath.sha256" -Encoding ascii
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @"
          ## Signed official Compose Material 3 APK

          - File: ``$env:RELEASE_APK_NAME``
          - SHA-256: ``$sha256``
          - Version: ``$env:EXPECTED_VERSION_NAME`` (``$env:EXPECTED_VERSION_CODE``)
          - Application ID: ``$env:APPLICATION_ID``
          - target SDK: ``$env:EXPECTED_TARGET_SDK``
          - Debuggable: ``$env:DEBUGGABLE``
          - Signing certificate: ``$env:EXPECTED_CERT_SHA256``
          "@

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComebackGooglePinyinInput-${{ env.ARTIFACT_LABEL }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for matching version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          APK_PATH: ${{ steps.artifact.outputs.path }}
          APK_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          $notes = @"
          ## 构建信息

          - Architecture: ``arm64-v8a``
          - Android versionName: ``$env:EXPECTED_VERSION_NAME``
          - Android versionCode: ``$env:EXPECTED_VERSION_CODE``
          - target SDK: ``$env:EXPECTED_TARGET_SDK``
          - Application ID: ``$env:APPLICATION_ID``
          - APK SHA-256: ``$env:APK_SHA256``
          - Signing certificate SHA-256: ``$env:EXPECTED_CERT_SHA256``
          - Source commit: ``${{ github.sha }}``
          "@
          $releaseNotesSource = "docs/releases/v$env:EXPECTED_VERSION_NAME.md"
          if (-not (Test-Path $releaseNotesSource)) {
            throw "Missing versioned release notes: $releaseNotesSource"
          }
          Get-Content $releaseNotesSource -Raw | Out-File release-notes.md -Encoding utf8
          Add-Content release-notes.md "`n$notes"
          gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:TAG_NAME already exists; published releases and assets are immutable"
          } else {
            gh release create $env:TAG_NAME `
              "$env:APK_PATH#$env:RELEASE_APK_NAME" `
              "$env:APK_PATH.sha256#$env:RELEASE_APK_NAME.sha256" `
              --repo $env:GITHUB_REPOSITORY --verify-tag `
              --title "v$env:EXPECTED_VERSION_NAME - $env:EXPECTED_RELEASE_TITLE" `
              --notes-file release-notes.md
          }

      - name: Remove restored keystore
        if: always()
        shell: pwsh
        run: Remove-Item work/signing/release.p12 -Force -ErrorAction SilentlyContinue
